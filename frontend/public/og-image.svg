<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="150" fill="#1e293b" opacity="0.5"/>
  <circle cx="1100" cy="530" r="200" fill="#1e293b" opacity="0.5"/>

  <!-- Accent Bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#accentGradient)"/>

  <!-- Logo/Brand Area -->
  <rect x="80" y="80" width="8" height="80" fill="#ef4444" rx="4"/>

  <!-- Main Title -->
  <text x="120" y="140" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff">
    IronPulse
  </text>

  <!-- Subtitle -->
  <text x="120" y="200" font-family="Arial, sans-serif" font-size="48" font-weight="600" fill="#ef4444">
    Gym &amp; Fitness
  </text>

  <!-- Tagline -->
  <text x="120" y="280" font-family="Arial, sans-serif" font-size="32" font-weight="400" fill="#94a3b8">
    Transform Your Body, Forge Your Strength
  </text>

  <!-- Features -->
  <text x="120" y="360" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">
    ✓ 24/7 Access
  </text>
  <text x="120" y="400" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">
    ✓ Expert Trainers
  </text>
  <text x="120" y="440" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#cbd5e1">
    ✓ AI-Powered Support
  </text>

  <!-- Call to Action -->
  <rect x="120" y="490" width="280" height="60" fill="#ef4444" rx="8"/>
  <text x="260" y="530" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#ffffff" text-anchor="middle">
    Join Today
  </text>

  <!-- Website URL -->
  <text x="1120" y="600" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#64748b" text-anchor="end">
    ironpulse.com
  </text>
</svg>