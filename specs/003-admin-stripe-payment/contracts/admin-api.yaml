openapi: 3.0.0
info:
  title: IronPulse Gym - Admin API
  version: 1.0.0
  description: API endpoints for admin dashboard and management operations

servers:
  - url: http://localhost:5000/api/v1
    description: Development server
  - url: https://api.ironpulse.com/api/v1
    description: Production server

paths:
  /admin/dashboard/stats:
    get:
      summary: Get Dashboard Statistics
      description: Retrieve key metrics for admin dashboard overview
      tags:
        - Admin Dashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Statistics retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Statistics retrieved successfully"
                  data:
                    type: object
                    properties:
                      totalRevenue:
                        type: number
                        description: Total revenue from successful payments (USD)
                        example: 15847.50
                      activeMembers:
                        type: integer
                        description: Count of users with confirmed bookings
                        example: 127
                      totalBookings:
                        type: integer
                        description: Total count of all bookings
                        example: 342
                      recentPayments:
                        type: array
                        description: Last 10 successful payments
                        items:
                          $ref: '#/components/schemas/PaymentWithRelations'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/bookings:
    get:
      summary: Get All Bookings
      description: Retrieve all bookings with filtering and pagination
      tags:
        - Admin Bookings
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, CONFIRMED, CANCELLED, COMPLETED]
          description: Filter by booking status
        - in: query
          name: startDate
          schema:
            type: string
            format: date
          description: Filter bookings from this date (ISO 8601)
          example: "2026-04-01"
        - in: query
          name: endDate
          schema:
            type: string
            format: date
          description: Filter bookings until this date (ISO 8601)
          example: "2026-04-30"
        - in: query
          name: search
          schema:
            type: string
          description: Search by member name or email
          example: "john"
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 10
            maximum: 100
            default: 50
          description: Number of records per page
      responses:
        '200':
          description: Bookings retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Bookings retrieved successfully"
                  data:
                    type: object
                    properties:
                      bookings:
                        type: array
                        items:
                          $ref: '#/components/schemas/BookingWithRelations'
                      total:
                        type: integer
                        description: Total count of bookings matching filters
                        example: 342
                      page:
                        type: integer
                        example: 1
                      pageSize:
                        type: integer
                        example: 50
                      totalPages:
                        type: integer
                        example: 7
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /admin/payments:
    get:
      summary: Get All Payments
      description: Retrieve all payment transactions with filtering and pagination
      tags:
        - Admin Payments
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, SUCCEEDED, FAILED, REFUNDED]
          description: Filter by payment status
        - in: query
          name: startDate
          schema:
            type: string
            format: date
          description: Filter payments from this date (ISO 8601)
          example: "2026-04-01"
        - in: query
          name: endDate
          schema:
            type: string
            format: date
          description: Filter payments until this date (ISO 8601)
          example: "2026-04-30"
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 10
            maximum: 100
            default: 50
          description: Number of records per page
      responses:
        '200':
          description: Payments retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Payments retrieved successfully"
                  data:
                    type: object
                    properties:
                      payments:
                        type: array
                        items:
                          $ref: '#/components/schemas/PaymentWithRelations'
                      total:
                        type: integer
                        description: Total count of payments matching filters
                        example: 289
                      page:
                        type: integer
                        example: 1
                      pageSize:
                        type: integer
                        example: 50
                      totalPages:
                        type: integer
                        example: 6
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token with ADMIN role required

  schemas:
    PaymentWithRelations:
      type: object
      properties:
        id:
          type: string
          example: "clx789ghi"
        userId:
          type: string
          example: "clx123abc"
        planId:
          type: string
          example: "clx456def"
        stripePaymentId:
          type: string
          example: "cs_test_a1b2c3d4e5f6"
        amount:
          type: number
          example: 29.99
        currency:
          type: string
          example: "usd"
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED, REFUNDED]
          example: "SUCCEEDED"
        createdAt:
          type: string
          format: date-time
          example: "2026-04-21T10:30:00Z"
        user:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
              example: "John Doe"
            email:
              type: string
              example: "john@example.com"
        plan:
          type: object
          properties:
            id:
              type: string
            title:
              type: string
              example: "Premium"
            price:
              type: number
              example: 29.99

    BookingWithRelations:
      type: object
      properties:
        id:
          type: string
          example: "clx999jkl"
        userId:
          type: string
          example: "clx123abc"
        planId:
          type: string
          example: "clx456def"
        paymentId:
          type: string
          nullable: true
          example: "clx789ghi"
        bookingDate:
          type: string
          format: date-time
          example: "2026-05-01T10:00:00Z"
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED, COMPLETED]
          example: "CONFIRMED"
        createdAt:
          type: string
          format: date-time
          example: "2026-04-21T10:30:00Z"
        user:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
              example: "John Doe"
            email:
              type: string
              example: "john@example.com"
        plan:
          type: object
          properties:
            id:
              type: string
            title:
              type: string
              example: "Premium"
            price:
              type: number
              example: 29.99
        payment:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PaymentWithRelations'

  responses:
    UnauthorizedError:
      description: Unauthorized - invalid or missing JWT token
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Authentication required"
              error:
                type: string
                example: "No token provided"

    ForbiddenError:
      description: Forbidden - user does not have ADMIN role
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Access denied"
              error:
                type: string
                example: "Admin privileges required"
