openapi: 3.0.0
info:
  title: IronPulse Gym - Bookings API
  version: 1.0.0
  description: Booking management endpoints (protected)

servers:
  - url: http://localhost:5000/api/v1
    description: Local development
  - url: https://api.ironpulse.com/api/v1
    description: Production

paths:
  /bookings:
    get:
      summary: Get user's bookings
      description: Returns all bookings for the authenticated user
      tags:
        - Bookings
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, CONFIRMED, CANCELLED, COMPLETED]
          description: Filter by booking status
        - name: upcoming
          in: query
          required: false
          schema:
            type: boolean
          description: Filter for upcoming bookings only
      responses:
        '200':
          description: Bookings retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Booking'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Create new booking
      description: Creates a new booking for the authenticated user
      tags:
        - Bookings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - planId
                - bookingDate
              properties:
                planId:
                  type: string
                  example: "clx1234567890abcdef"
                bookingDate:
                  type: string
                  format: date-time
                  example: "2026-04-25T10:00:00Z"
                  description: Must be present or future date
                timeSlot:
                  type: string
                  example: "10:00-11:00"
                  description: Optional time slot (future enhancement)
      responses:
        '201':
          description: Booking created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Booking'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                pastDate:
                  value:
                    success: false
                    error: "Booking date must be in the future"
                    code: "INVALID_DATE"
                invalidPlan:
                  value:
                    success: false
                    error: "Plan not found"
                    code: "PLAN_NOT_FOUND"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /bookings/{id}:
    get:
      summary: Get booking by ID
      description: Returns a single booking (user can only access their own bookings)
      tags:
        - Bookings
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "clx1234567890abcdef"
      responses:
        '200':
          description: Booking retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Booking'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (not user's booking)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Cancel booking
      description: Cancels a booking (user can only cancel their own bookings)
      tags:
        - Bookings
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "clx1234567890abcdef"
      responses:
        '200':
          description: Booking cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Booking'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden (not user's booking)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    Booking:
      type: object
      properties:
        id:
          type: string
          example: "clx1234567890abcdef"
        userId:
          type: string
          example: "clx0987654321fedcba"
        planId:
          type: string
          example: "clx1234567890abcdef"
        bookingDate:
          type: string
          format: date-time
          example: "2026-04-25T10:00:00Z"
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED, COMPLETED]
          example: "PENDING"
        createdAt:
          type: string
          format: date-time
          example: "2026-04-20T10:30:00Z"
        plan:
          $ref: '#/components/schemas/Plan'
          description: Populated plan object (optional)

    Plan:
      type: object
      properties:
        id:
          type: string
          example: "clx1234567890abcdef"
        title:
          type: string
          example: "Premium Plan"
        price:
          type: number
          example: 99.99
        duration:
          type: integer
          example: 3

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Error message"
        code:
          type: string
          example: "ERROR_CODE"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
