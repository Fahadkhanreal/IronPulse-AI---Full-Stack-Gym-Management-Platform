openapi: 3.0.0
info:
  title: IronPulse Gym API - Bookings
  version: 1.0.0
  description: Session booking management endpoints

servers:
  - url: http://localhost:5000/api/v1
    description: Development server

paths:
  /bookings:
    get:
      summary: Get user's bookings
      description: Retrieve all bookings for the authenticated user
      tags:
        - Bookings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bookings retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Bookings retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookingWithRelations'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: Create new booking
      description: Book a gym session with a specific plan and date
      tags:
        - Bookings
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - planId
                - bookingDate
              properties:
                planId:
                  type: string
                  example: "clh1234567890"
                bookingDate:
                  type: string
                  format: date-time
                  example: "2026-04-25T10:00:00Z"
                  description: Must be present or future date
      responses:
        '201':
          description: Booking created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Booking created successfully"
                  data:
                    $ref: '#/components/schemas/BookingWithRelations'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Booking date cannot be in the past"
                  error:
                    type: string
                    example: "ValidationError"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Plan not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Plan not found"
                  error:
                    type: string
                    example: "NotFoundError"

  /bookings/{id}:
    delete:
      summary: Cancel booking
      description: Cancel a booking (updates status to CANCELLED)
      tags:
        - Bookings
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "clh1234567890"
      responses:
        '200':
          description: Booking cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Booking cancelled successfully"
                  data:
                    $ref: '#/components/schemas/BookingWithRelations'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Cannot cancel another user's booking
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "You can only cancel your own bookings"
                  error:
                    type: string
                    example: "AuthorizationError"
        '404':
          description: Booking not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Booking not found"
                  error:
                    type: string
                    example: "NotFoundError"

components:
  schemas:
    Booking:
      type: object
      properties:
        id:
          type: string
          example: "clh1234567890"
        userId:
          type: string
          example: "clh0987654321"
        planId:
          type: string
          example: "clh1111111111"
        bookingDate:
          type: string
          format: date-time
          example: "2026-04-25T10:00:00Z"
        status:
          type: string
          enum: [PENDING, CONFIRMED, CANCELLED, COMPLETED]
          example: "PENDING"
        createdAt:
          type: string
          format: date-time
          example: "2026-04-20T10:30:00Z"

    BookingWithRelations:
      allOf:
        - $ref: '#/components/schemas/Booking'
        - type: object
          properties:
            plan:
              type: object
              properties:
                id:
                  type: string
                title:
                  type: string
                  example: "Premium"
                price:
                  type: number
                  example: 59.99
                duration:
                  type: integer
                  example: 3

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Authentication required"
              error:
                type: string
                example: "AuthenticationError"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
