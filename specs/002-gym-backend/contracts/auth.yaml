openapi: 3.0.0
info:
  title: IronPulse Gym API - Authentication
  version: 1.0.0
  description: Authentication endpoints for user signup and login

servers:
  - url: http://localhost:5000/api/v1
    description: Development server
  - url: https://api.ironpulse.com/api/v1
    description: Production server

paths:
  /auth/signup:
    post:
      summary: Register a new user
      description: Creates a new user account with hashed password and returns JWT token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: "John Doe"
                email:
                  type: string
                  format: email
                  example: "john@example.com"
                password:
                  type: string
                  minLength: 8
                  pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d).+$"
                  example: "Password123"
                  description: Must contain uppercase, lowercase, and number
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "User registered successfully"
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      user:
                        $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                weakPassword:
                  value:
                    success: false
                    message: "Password must contain uppercase, lowercase, and number"
                    error: "ValidationError"
                duplicateEmail:
                  value:
                    success: false
                    message: "Email already exists"
                    error: "ValidationError"

  /auth/login:
    post:
      summary: Login user
      description: Authenticates user credentials and returns JWT token
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "john@example.com"
                password:
                  type: string
                  example: "Password123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Login successful"
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: "Invalid credentials"
                error: "AuthenticationError"

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: "clh1234567890"
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          example: "john@example.com"
        role:
          type: string
          enum: [MEMBER, ADMIN]
          example: "MEMBER"
        createdAt:
          type: string
          format: date-time
          example: "2026-04-20T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-04-20T10:30:00Z"
      description: User object (password field excluded)

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Error message"
        error:
          type: string
          example: "ErrorType"
