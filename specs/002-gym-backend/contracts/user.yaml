openapi: 3.0.0
info:
  title: IronPulse Gym API - User Profile
  version: 1.0.0
  description: User profile management endpoints

servers:
  - url: http://localhost:5000/api/v1
    description: Development server

paths:
  /user/profile:
    get:
      summary: Get user profile
      description: Retrieve authenticated user's profile information
      tags:
        - User
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Profile retrieved successfully"
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      summary: Update user profile
      description: Update authenticated user's profile information (name and/or email)
      tags:
        - User
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                  example: "John Updated"
                email:
                  type: string
                  format: email
                  example: "john.updated@example.com"
              description: At least one field (name or email) must be provided
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Profile updated successfully"
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Email already in use"
                  error:
                    type: string
                    example: "ValidationError"
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          example: "clh1234567890"
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          example: "john@example.com"
        role:
          type: string
          enum: [MEMBER, ADMIN]
          example: "MEMBER"
        createdAt:
          type: string
          format: date-time
          example: "2026-04-20T10:30:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-04-20T10:30:00Z"
      description: User object (password field excluded for security)

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Authentication required"
              error:
                type: string
                example: "AuthenticationError"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login or /auth/signup
