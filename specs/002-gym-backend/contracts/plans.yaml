openapi: 3.0.0
info:
  title: IronPulse Gym API - Plans
  version: 1.0.0
  description: Membership plans management endpoints

servers:
  - url: http://localhost:5000/api/v1
    description: Development server

paths:
  /plans:
    get:
      summary: Get all plans
      description: Retrieve list of all available membership plans (public endpoint)
      tags:
        - Plans
      responses:
        '200':
          description: Plans retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Plans retrieved successfully"
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plan'

    post:
      summary: Create new plan (Admin only)
      description: Create a new membership plan
      tags:
        - Plans
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - price
                - duration
                - features
              properties:
                title:
                  type: string
                  minLength: 2
                  maxLength: 50
                  example: "Premium"
                price:
                  type: number
                  minimum: 0
                  example: 59.99
                duration:
                  type: integer
                  minimum: 1
                  example: 3
                  description: Duration in months
                features:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  example: ["Access to gym equipment", "Personal trainer sessions"]
      responses:
        '201':
          description: Plan created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Plan created successfully"
                  data:
                    $ref: '#/components/schemas/Plan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /plans/{id}:
    get:
      summary: Get plan by ID
      description: Retrieve a specific plan by its ID (public endpoint)
      tags:
        - Plans
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "clh1234567890"
      responses:
        '200':
          description: Plan retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Plan retrieved successfully"
                  data:
                    $ref: '#/components/schemas/Plan'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Update plan (Admin only)
      description: Update an existing membership plan
      tags:
        - Plans
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                price:
                  type: number
                duration:
                  type: integer
                features:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Plan updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Plan updated successfully"
                  data:
                    $ref: '#/components/schemas/Plan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete plan (Admin only)
      description: Delete a membership plan
      tags:
        - Plans
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plan deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Plan deleted successfully"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    Plan:
      type: object
      properties:
        id:
          type: string
          example: "clh1234567890"
        title:
          type: string
          example: "Premium"
        price:
          type: number
          example: 59.99
        duration:
          type: integer
          example: 3
          description: Duration in months
        features:
          type: array
          items:
            type: string
          example: ["Access to gym equipment", "Personal trainer sessions"]
        createdAt:
          type: string
          format: date-time
          example: "2026-04-20T10:30:00Z"

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Authentication required"
              error:
                type: string
                example: "AuthenticationError"

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Admin access required"
              error:
                type: string
                example: "AuthorizationError"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: false
              message:
                type: string
                example: "Plan not found"
              error:
                type: string
                example: "NotFoundError"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
